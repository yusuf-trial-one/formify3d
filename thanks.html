<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You • Formify 3D</title>
  <meta name="description" content="Thank you for contacting Formify 3D." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root{
      --primary:#ff9b21;
      --accent:#ff2d95;
      --dark:#03040a;
      --text:#ffffff;
      --text-dim:rgba(255,255,255,.78);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 75% 20%, rgba(255,106,0,.28), transparent 35%),
        radial-gradient(circle at 20% 10%, rgba(255,45,149,.18), transparent 35%),
        #03040a;
    }

    .site-header{
      background:rgba(3,4,10,.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .nav-inner{
      max-width:1240px;
      margin:0 auto;
      padding:18px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      flex-wrap:wrap;
    }

    .brand-logo{
      width:clamp(220px,24vw,330px);
      height:auto;
      display:block;
    }

    .site-nav{
      display:flex;
      gap:1rem;
      flex-wrap:wrap;
    }

    .site-nav a{
      color:#fff;
      text-decoration:none;
      font-weight:700;
      padding:.75rem 1.25rem;
      border-radius:999px;
      border:1.6px solid rgba(255,145,42,.88);
      background:rgba(0,0,0,.18);
    }

    .site-nav a:hover{
      background:linear-gradient(135deg,#ffb11b,#ff7a1a,#ff2f8b);
      color:#111827;
    }

    main{
      min-height:calc(100vh - 96px);
      display:grid;
      place-items:center;
      padding:64px 24px;
    }

    .thank-card{
      width:min(100%,760px);
      text-align:center;
      padding:44px 32px;
      border-radius:32px;
      background:
        radial-gradient(circle at top left, rgba(255,177,27,.18), transparent 48%),
        linear-gradient(145deg,rgba(15,23,42,.96),rgba(8,10,18,.98));
      border:1px solid rgba(255,255,255,.1);
      box-shadow:0 30px 70px rgba(0,0,0,.55);
    }

    .icon{
      width:88px;
      height:88px;
      margin:0 auto 22px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#ffb11b,#ff7a1a,#ff2f8b);
      color:#111827;
      font-size:2.4rem;
      box-shadow:0 18px 38px rgba(0,0,0,.4);
    }

    h1{
      font-size:clamp(2.3rem,5vw,4rem);
      line-height:1;
      margin:0 0 14px;
      font-weight:900;
      letter-spacing:-.04em;
    }

    h1 span{
      background:linear-gradient(135deg,#ffb11b,#ff7a1a,#ff2f8b);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    p{
      margin:0 auto 26px;
      max-width:560px;
      color:var(--text-dim);
      font-size:1.08rem;
      line-height:1.7;
    }

    .button-row{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:14px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      text-decoration:none;
      font-weight:900;
      padding:.95rem 1.25rem;
      border-radius:999px;
      transition:.18s ease;
    }

    .btn-main{
      background:linear-gradient(135deg,#ffb11b,#ff7a1a,#ff2f8b);
      color:#111827;
      box-shadow:0 16px 34px rgba(0,0,0,.35);
    }

    .btn-secondary{
      color:#fff;
      border:1.6px solid rgba(255,145,42,.88);
      background:rgba(0,0,0,.18);
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .small-note{
      margin-top:24px;
      color:rgba(255,255,255,.58);
      font-size:.9rem;
    }

    @media(max-width:640px){
      .nav-inner{align-items:flex-start}
      .site-nav a{padding:.65rem .95rem;font-size:.92rem}
      .thank-card{padding:34px 22px}
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" aria-label="Formify 3D home">
        <img class="brand-logo" src="logo.png" alt="Formify 3D">
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="thank-card">
      <div class="icon">
        <i class="fa-solid fa-check"></i>
      </div>

      <h1>Thank <span>You!</span></h1>

      <p>
        Your message has been sent successfully. I’ll check it and reply as soon as I can.
        If it was an order request, I’ll use the details you included to help sort it out faster.
      </p>

      <div class="button-row">
        <a class="btn btn-main" href="index.html">
          <i class="fa-solid fa-house"></i>
          Back to Home
        </a>

        <a class="btn btn-secondary" href="products.html">
          <i class="fa-solid fa-cube"></i>
          Browse Products
        </a>
      </div>

      <div class="small-note">
        Formify 3D • Thanks for supporting a young maker
      </div>
    </section>
  </main>
</body>
</html>
