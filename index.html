<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formify3D</title>
  <link rel="stylesheet" href="formify_style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <img src="images/logo.png" alt="Formify3D Logo">
  </div>

  <nav>
    <a class="active">Home</a>
    <a>About</a>
    <a>Products</a>
    <a>Gallery</a>
    <a>Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>From Ideas to Reality, in <span>3D</span></h1>
    <p>High quality 3D printed fidgets, helpers, and custom creations.</p>

    <div class="buttons">
      <button class="primary">Browse Products</button>
      <button class="secondary">Request Custom Order</button>
    </div>
  </div>

  <div class="hero-image">
    <img src="images/detailed-logo.png" alt="Formify3D Detailed Logo">
  </div>
</section>

</body>
</html>
